<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pega Bolinhas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d14; font-family: system-ui, sans-serif; color: #fff; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  video { opacity: .55; }
  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 16px 24px; font-size: clamp(22px, 4vw, 40px); font-weight: 800; text-shadow: 0 2px 8px #000a; pointer-events: none; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b0d14cc; text-align: center; padding: 24px; }
  #overlay h1 { margin: 0; font-size: clamp(32px, 6vw, 64px); }
  #overlay p { margin: 0; max-width: 460px; opacity: .85; }
  button { font: inherit; font-weight: 700; font-size: 20px; padding: 14px 36px; border: 0; border-radius: 999px; background: #ffd23f; color: #222; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="hud"><span>⏱ <span id="time">10</span>s</span><span>⭐ <span id="score">0</span></span></div>
  <div id="status" style="position:absolute;bottom:16px;left:0;right:0;text-align:center;font-weight:600;text-shadow:0 2px 6px #000"></div>
  <div id="overlay">
    <h1 id="title">Pega Bolinhas ✋</h1>
    <p id="msg">Use a mão na frente da câmera para pegar as bolinhas. Você tem 10 segundos!</p>
    <button id="btn">Começar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
const DURATION = 10;
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const btn = document.getElementById('btn');
const timeEl = document.getElementById('time');
const scoreEl = document.getElementById('score');

let hands = [];          // lista de mãos: cada uma com pontos em pixels
let balls = [], particles = [];
let running = false, score = 0, startT = 0, lastSpawn = 0;
let ready = false;

function resize() {
  canvas.width = innerWidth; canvas.height = innerHeight;
}
addEventListener('resize', resize); resize();

// Converte coordenada normalizada do vídeo (com object-fit: cover) para pixels do canvas.
function toScreen(lm) {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(canvas.width / vw, canvas.height / vh);
  const ox = (canvas.width - vw * s) / 2, oy = (canvas.height - vh * s) / 2;
  return { x: lm.x * vw * s + ox, y: lm.y * vh * s + oy };
}

let mpHands = null, detecting = false, camOk = false;
const statusEl = document.getElementById('status');

function setupHands() {
  if (typeof Hands === 'undefined') { statusEl.textContent = '⚠ Biblioteca MediaPipe não carregou (verifique a internet)'; return; }
  mpHands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
  });
  mpHands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
  mpHands.onResults(res => {
    statusEl.textContent = '';
    hands = (res.multiHandLandmarks || []).map(l => l.map(toScreen));
  });
  statusEl.textContent = 'Carregando detecção de mão…';
}

async function detectLoop() {
  if (mpHands && !detecting && video.readyState >= 2) {
    detecting = true;
    try { await mpHands.send({ image: video }); }
    catch (e) { statusEl.textContent = '⚠ Erro na detecção: ' + e.message; }
    detecting = false;
  }
  requestAnimationFrame(detectLoop);
}

async function init() {
  btn.disabled = true; btn.textContent = 'Abrindo câmera…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, frameRate: 30, facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await video.play();
    camOk = true;
  } catch (e) {
    document.getElementById('msg').textContent = 'Não consegui acessar a câmera. Permita o acesso e abra via http://localhost ou https.';
    btn.disabled = false; btn.textContent = 'Tentar de novo';
    return;
  }
  setupHands();
  detectLoop();
  ready = true;
  start();
}

function start() {
  score = 0; balls = []; particles = [];
  scoreEl.textContent = 0; timeEl.textContent = DURATION;
  overlay.hidden = true;
  running = true; startT = performance.now(); lastSpawn = 0;
}

function end() {
  running = false;
  document.getElementById('title').textContent = `Fim! ${score} bolinha${score === 1 ? '' : 's'} 🎉`;
  document.getElementById('msg').textContent = 'Quer tentar bater seu recorde?';
  btn.disabled = false; btn.textContent = 'Jogar de novo';
  overlay.hidden = false;
}

btn.onclick = () => ready ? start() : init();

function spawn() {
  const r = 28 + Math.random() * 26;
  const hue = Math.floor(Math.random() * 360);
  balls.push({
    x: r + Math.random() * (canvas.width - 2 * r),
    y: 90 + r + Math.random() * (canvas.height - 2 * r - 110),
    r, hue, born: performance.now(), life: 1800 + Math.random() * 800
  });
}

function burst(x, y, hue) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, hue, life: 1 });
  }
}

// Pontas dos dedos + centro da palma
const TIPS = [4, 8, 12, 16, 20, 9];

function loop() {
  const now = performance.now();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (running) {
    const elapsed = (now - startT) / 1000;
    const left = Math.max(0, DURATION - elapsed);
    timeEl.textContent = Math.ceil(left);
    if (left <= 0) end();

    const interval = 550 - Math.min(250, elapsed * 25); // acelera com o tempo
    if (now - lastSpawn > interval && balls.length < 6) { spawn(); lastSpawn = now; }
  }

  // bolinhas
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    const age = Math.max(0, now - b.born);
    if (age > b.life) { balls.splice(i, 1); continue; }
    const pop = Math.min(1, age / 200);
    const fade = Math.min(1, (b.life - age) / 400);
    const rad = b.r * pop * (1 + 0.06 * Math.sin(age / 120));

    let hit = false;
    if (running) {
      for (const h of hands) {
        for (const t of TIPS) {
          if (Math.hypot(h[t].x - b.x, h[t].y - b.y) < rad + 12) { hit = true; break; }
        }
        if (hit) break;
      }
    }
    if (hit) {
      score++; scoreEl.textContent = score;
      burst(b.x, b.y, b.hue);
      balls.splice(i, 1);
      continue;
    }
    ctx.globalAlpha = fade;
    const g = ctx.createRadialGradient(b.x - rad * .3, b.y - rad * .3, rad * .1, b.x, b.y, rad);
    g.addColorStop(0, `hsl(${b.hue} 100% 80%)`);
    g.addColorStop(1, `hsl(${b.hue} 90% 50%)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, rad, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.03;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = `hsl(${p.hue} 100% 65%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // mãos (pontas dos dedos destacadas)
  for (const h of hands) {
    ctx.fillStyle = '#ffffff';
    for (const t of TIPS) {
      ctx.beginPath(); ctx.arc(h[t].x, h[t].y, 9, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(h[9].x, h[9].y, 26, 0, 7); ctx.stroke();
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
